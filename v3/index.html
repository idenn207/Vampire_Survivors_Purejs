<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V3 - Vampire Survivors Clone</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0f0f1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #game-container {
      position: relative;
    }

    #game-canvas {
      display: block;
      border: 2px solid #333;
      border-radius: 4px;
    }

    #stats {
      position: absolute;
      bottom: -30px;
      left: 0;
      color: #666;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas" width="800" height="600"></canvas>
    <div id="stats"></div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
